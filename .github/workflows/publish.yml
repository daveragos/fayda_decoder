# Publishes to pub.dev when a version tag such as v0.1.1 is pushed.
#
# One-time setup, after the first version is published by hand:
# pub.dev > fayda_decoder > Admin > Automated publishing > enable GitHub
# Actions for this repository with tag pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # OIDC token for pub.dev, no stored secrets
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
