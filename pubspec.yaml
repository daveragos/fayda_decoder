name: fayda_decoder
description: >-
  Offline decoder and signature verifier for the QR code on the Ethiopian
  Fayda national ID card. Community port; not affiliated with NIDP.
version: 0.1.0
# repository: https://github.com/<owner>/<repo>
# issue_tracker: https://github.com/<owner>/<repo>/issues

topics:
  - ethiopia
  - fayda
  - national-id
  - qr-code
  - kyc

executables:
  fayda_decoder:

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3
  image: ^4.3.0
  zxing2: ^0.2.4

dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: ^1.25.6
