name: fayda_decoder
description: >-
  Offline decoder and signature verifier for the QR code on the Ethiopian
  Fayda national ID card. Community port; not affiliated with NIDP.
version: 0.1.0
repository: https://github.com/daveragos/fayda_decoder
issue_tracker: https://github.com/daveragos/fayda_decoder/issues

topics:
  - ethiopia
  - fayda
  - national-id
  - qr-code
  - kyc

screenshots:
  - description: Example app home screen with camera, photo and sample-card options.
    path: doc/screenshots/home.png
  - description: A decoded synthetic card with its fields and a verified signature badge.
    path: doc/screenshots/result.png

executables:
  fayda_decoder:

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3
  image: ^4.3.0
  zxing2: ^0.2.4

dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: ^1.25.6
